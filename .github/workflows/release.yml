name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  actions: read  # to check the CI run for the commit being released

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Resolve the release tag once, then verify it describes what is about to be built: the
      # tag must be v<versionName>, and if it already exists it must point at this commit.
      # Otherwise a manual run could publish this build under another version's tag/name.
      - name: Resolve and verify release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"; exit 1
          fi
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Release tag '$TAG' does not match versionName '$VERSION_NAME' (expected 'v$VERSION_NAME')"; exit 1
          fi
          TAG_COMMIT=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          [ -z "$TAG_COMMIT" ] && TAG_COMMIT=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Tag '$TAG' already exists at $TAG_COMMIT, but this run built $GITHUB_SHA"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # UI tests run only after merging (ci.yml, develop/main pushes), so a UI regression can sit
      # on develop. Never release such a commit: require a passing CI run (push or manual,
      # i.e. including the UI tests) for exactly this commit, waiting up to 30 min if it's
      # still running.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI passed for $GITHUB_SHA"; exit 0
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -eq 0 ]; then
              if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
                echo "::error::No CI run for $GITHUB_SHA. Release a commit that is on develop/main, or run CI on it manually (Actions > CI > Run workflow) first."
              else
                echo "::error::CI failed for $GITHUB_SHA; fix it before releasing."
              fi
              exit 1
            fi
            echo "CI for $GITHUB_SHA still running; waiting (check $attempt of 60)"
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"; exit 1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # app/build.gradle.kts signs only when keystore.properties exists (so keystore-less
      # source builds such as F-Droid's work). A release must never fall back to that, so
      # missing secrets fail the run here instead of producing an unsigned APK.
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; refusing to build an unsigned release"; exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s\n' "storeFile=../release-keystore.jks" > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      # Publish only an APK signed with the release certificate (the one F-Droid's
      # AllowedAPKSigningKeys and existing installs expect).
      - name: Verify release APK signature
        env:
          EXPECTED_CERT_SHA256: 49646ed216aa6e8f23326999052f6704b6e9228be310b56b6e8b3ab8113bae04
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK not found — the release build was not signed"; exit 1
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest/ {print $NF}' | sort -u)
          if [ "$CERTS" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::$APK is signed with '$CERTS', expected $EXPECTED_CERT_SHA256"; exit 1
          fi
          echo "Signed with the release certificate ($CERTS)"

      # A failed release build publishes nothing. For diagnosis only, build a debug APK and keep
      # it as a workflow artifact — never as a release asset.
      - name: Build diagnostic debug APK
        if: failure()
        run: ./gradlew assembleDebug

      - name: Upload diagnostic debug APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate checksums
        id: checksums
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "md5=$(md5sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha1=$(sha1sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Create a new tag at the commit that was built, not the default branch's head.
          target_commitish: ${{ github.sha }}
          name: Calculator M3 ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |

            ## 🔑 Checksums

            | Algorithm  | Value |
            |------------|-------|
            | **MD5**    | `${{ steps.checksums.outputs.md5 }}` |
            | **SHA1**   | `${{ steps.checksums.outputs.sha1 }}` |
            | **SHA-256**| `${{ steps.checksums.outputs.sha256 }}` |
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play
        if: ${{ env.GOOGLE_PLAY_JSON != '' }}
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vagujhelyigergely.calculatorm3
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
          changesNotSentForReview: false
