name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same PR/branch supersedes a running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # By default only develop/main runs save the cache, so every PR run starts cold and
          # re-downloads everything. Let PR runs save too: a re-run after a failed download
          # (GitHub release downloads, which serve Gradle and some Maven artifacts, sometimes
          # return 504) then starts warm.
          cache-read-only: false

      # Gradle's own dependency-download retry gives up within a second; outages last minutes.
      # CI-only (user-level gradle.properties): 8 retries with exponential backoff from 2s.
      - name: Make dependency downloads retry patiently
        run: |
          mkdir -p ~/.gradle
          {
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> ~/.gradle/gradle.properties

      # The wrapper fetches Gradle from GitHub release downloads, which sometimes answer 504 or
      # time out; retry that one-off download with a growing pause (~7.5 min worst case) instead
      # of failing the whole job. Once a develop run has cached it, setup-gradle restores it.
      - name: Download Gradle (with retries)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            pause=$((attempt * 30))
            echo "Gradle download failed (attempt $attempt of 5); retrying in ${pause}s"
            sleep "$pause"
          done
          exit 1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  ui-tests:
    name: UI tests (emulator, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # By default only develop/main runs save the cache, so every PR run starts cold and
          # re-downloads everything. Let PR runs save too: a re-run after a failed download
          # (GitHub release downloads, which serve Gradle and some Maven artifacts, sometimes
          # return 504) then starts warm.
          cache-read-only: false

      # Gradle's own dependency-download retry gives up within a second; outages last minutes.
      # CI-only (user-level gradle.properties): 8 retries with exponential backoff from 2s.
      - name: Make dependency downloads retry patiently
        run: |
          mkdir -p ~/.gradle
          {
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> ~/.gradle/gradle.properties

      # The wrapper fetches Gradle from GitHub release downloads, which sometimes answer 504 or
      # time out; retry that one-off download with a growing pause (~7.5 min worst case) instead
      # of failing the whole job. Once a develop run has cached it, setup-gradle restores it.
      - name: Download Gradle (with retries)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            pause=$((attempt * 30))
            echo "Gradle download failed (attempt $attempt of 5); retrying in ${pause}s"
            sleep "$pause"
          done
          exit 1

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build both APKs before booting the emulator, so emulator time is spent only on tests.
      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # API 34: CalculatorUiTest notes an AndroidX Test incompatibility on API 35.
      # The emulator is throwaway, so connectedDebugAndroidTest's install/uninstall is harmless.
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/connected/
          retention-days: 7
