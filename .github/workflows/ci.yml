name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same PR/branch supersedes a running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-build

      # Compiles the app and runs the JVM tests. The APKs are built once, in ui-tests.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-build

      # Fails on lint errors (abortOnError, the default); warnings are reported but don't fail.
      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI tests (emulator, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-build

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build both APKs before booting the emulator, so emulator time is spent only on tests.
      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # API 34: CalculatorUiTest notes an AndroidX Test incompatibility on API 35.
      # The app ships only arm64-v8a (LiteRT-LM's native libraries), so the x86_64 emulator must
      # be a Google APIs image: those include ARM binary translation and report arm64-v8a, where
      # the plain "default" image makes Gradle answer "No compatible devices connected".
      # The emulator is throwaway, so connectedDebugAndroidTest's install/uninstall is harmless.
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Emulator ABIs: $(adb shell getprop ro.product.cpu.abilist)"
            ./gradlew connectedDebugAndroidTest

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/connected/
          retention-days: 7
